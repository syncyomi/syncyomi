openapi: 3.0.0
info:
  title: SyncYomi Server API
  description: SyncYomi Server API
  contact:
    name: Kaiser
    email: kaiserbh@proton.me
    url: https://github.com/SyncYomi/SyncYomi
  version: 1.0.0
servers:
  - url: http://localhost:8282/api
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '204':
          description: Login successful
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: User logout
      operationId: logoutUser
      responses:
        '204':
          description: Logout successful
        '500':
          description: Internal server error
  /auth/onboard:
    get:
      tags:
        - Authentication
      summary: Check if onboarding is possible
      description: Check if onboarding is possible
      operationId: canOnboard
      responses:
        '204':
          description: Onboarding is possible
        '403':
          description: Onboarding is unavailable
        '500':
          description: Internal server error
    post:
      tags:
        - Authentication
      summary: User onboarding
      description: User onboarding
      operationId: onboardUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '204':
          description: Onboarding successful
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate if a user is authenticated
      description: Validate if a user is authenticated
      operationId: validateUser
      responses:
        '204':
          description: User is authenticated
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /config:
    get:
      summary: Get server configuration
      description: Get server configuration
      operationId: getConfig
      tags:
        - Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJson'
        default:
          description: Unexpected error
    patch:
      summary: Update server configuration
      description: Update server configuration
      operationId: updateConfig
      tags:
        - Configuration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '204':
          description: No Content
        default:
          description: Unexpected error
  /healthz/liveness:
    get:
      summary: Get server liveness status
      description: Get server liveness status
      operationId: getLiveness
      tags:
        - Health Check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
        default:
          description: Unexpected error
  /healthz/readiness:
    get:
      summary: Get server readiness status
      description: Get server readiness status
      operationId: getReadiness
      tags:
        - Health Check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: Unhealthy. Database unreachable
          content:
            text/plain:
              schema:
                type: string
                example: Unhealthy. Database unreachable
        default:
          description: Unexpected error
  /keys:
    get:
      tags:
        - API Keys
      summary: List all API keys
      description: List all API keys
      operationId: listAPIKeys
      responses:
        '200':
          description: An array of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        '500':
          description: Internal server error
    post:
      tags:
        - API Keys
      summary: Store a new API key
      description: Store a new API key
      operationId: storeAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKey'
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '500':
          description: Internal server error
  /keys/{apikey}:
    delete:
      tags:
        - API Keys
      summary: Delete an API key
      description: Delete an API key
      operationId: deleteAPIKey
      parameters:
        - name: apikey
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key deleted successfully
        '500':
          description: Internal server error
  /logs/files:
    get:
      summary: Get log files
      description: Get log files
      operationId: getLogFiles
      tags:
        - Logs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogfilesResponse'
        default:
          description: Unexpected error

  /logs/files/{logFile}:
    get:
      summary: Download log file
      description: Download log file
      operationId: downloadLogFile
      tags:
        - Logs
      parameters:
        - name: logFile
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Unexpected error
  /notification:
    get:
      summary: List notifications
      description: List notifications
      operationId: listNotifications
      tags:
        - Notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        default:
          description: Unexpected error
    post:
      summary: Store notification
      description: Store notification
      operationId: storeNotification
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        default:
          description: Unexpected error
  /notification/test:
    post:
      summary: Test notification
      description: Test notification
      operationId: testNotification
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
      responses:
        '204':
          description: No Content
        default:
          description: Unexpected error
  /notification/{notificationID}:
    put:
      summary: Update notification
      description: Update notification
      operationId: updateNotification
      tags:
        - Notifications
      parameters:
        - name: notificationID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        default:
          description: Unexpected error
    delete:
      summary: Delete notification
      description: Delete notification
      operationId: deleteNotification
      tags:
        - Notifications
      parameters:
        - name: notificationID
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        default:
          description: Unexpected error
  /sync/content:
    get:
      tags:
        - Sync
      summary: Download sync data (protocol v1)
      deprecated: true
      description: |
        Returns the library rendered from the server's item store as a Tachiyomi backup.
        Kept for clients that have not adopted protocol v2; responses carry a `Deprecation`
        header. New clients should use `/sync/v2/merge`.

        Send the `ETag` from a previous response as `If-None-Match` to get `304` when
        nothing changed. The ETag value is opaque and must be echoed back verbatim.
      operationId: getSyncContent
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceName'
      responses:
        '200':
          description: Sync payload
          headers:
            ETag:
              schema:
                type: string
              description: Opaque version tag of the payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified since the `If-None-Match` ETag
        '401':
          description: Unauthorized
        '404':
          description: No sync data stored for this API key
        '500':
          description: Internal server error
    put:
      tags:
        - Sync
      summary: Upload sync data (protocol v1)
      deprecated: true
      description: |
        Merges the uploaded backup into the server's item store (items present are merged,
        absent items are kept) and returns the new `ETag`.

        Send the last known `ETag` as `If-Match` to get `412` instead of overwriting data
        another device uploaded in the meantime; the client should then download, merge and
        upload again. Without `If-Match` the payload is replaced unconditionally.

        The body may be gzip-compressed (`Content-Encoding: gzip`). Bodies larger than the
        configured `syncMaxBodySizeMB` are rejected with `413`.
      operationId: putSyncContent
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceName'
        - name: Content-Encoding
          in: header
          required: false
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored
          headers:
            ETag:
              schema:
                type: string
              description: New opaque version tag of the payload
        '400':
          description: Body is not a valid backup
        '401':
          description: Unauthorized
        '412':
          description: The `If-Match` ETag does not match the stored payload
        '413':
          description: Body larger than the configured limit
        '500':
          description: Internal server error
  /sync/event:
    post:
      tags:
        - Sync
      summary: Report sync event
      description: |
        Report a device-reported sync status (e.g. started, success, failed, cancelled).
        Used by clients to notify the server of sync progress. Triggers configured
        notifications (Discord, Telegram, etc.) and updates the device and status shown
        in the web UI.
      operationId: reportSyncEvent
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncEventRequest'
      responses:
        '204':
          description: Event reported successfully
        '400':
          description: Invalid event type or bad request body
        '401':
          description: Unauthorized (missing or invalid API key)
        '500':
          description: Internal server error
  /sync/v2/capabilities:
    get:
      tags:
        - Sync v2
      summary: Discover protocol v2
      description: Returns 200 on servers that implement protocol v2; older servers answer 404 and clients fall back to v1.
      operationId: syncV2Capabilities
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 2
                  merge:
                    type: string
                    example: /api/sync/v2/merge
                  snapshot:
                    type: string
                    example: /api/sync/v2/snapshot
  /sync/v2/merge:
    post:
      tags:
        - Sync v2
      summary: Merge the client's library and receive what it lacks
      description: |
        The body is a Tachiyomi backup (protobuf, optionally gzip-compressed) holding the
        client's full library or only what changed since its last successful upload. Items
        present are merged item by item (higher `version` wins, ties keep the server copy);
        items absent are left untouched. Only explicit tombstones delete: category uids listed
        in `X-Sync-Deleted-Categories`.

        The response is a backup with everything the client is missing: all live categories
        plus manga, chapters and settings changed since `X-Sync-Cursor` by other devices and
        any item where the server copy won. `X-Sync-Cursor: 0` or `X-Sync-Full: true` returns
        the whole library.
      operationId: syncV2Merge
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Device-ID
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
          description: Stable identifier of the device
        - $ref: '#/components/parameters/DeviceName'
        - name: X-Sync-Cursor
          in: header
          required: false
          schema:
            type: integer
            format: int64
          description: Cursor from the previous response (0 or absent for the first sync)
        - name: X-Sync-Full
          in: header
          required: false
          schema:
            type: boolean
          description: The body is the complete library; the response is the complete merged library
        - name: X-Sync-Deleted-Categories
          in: header
          required: false
          schema:
            type: string
          description: Comma-separated category uids the client deleted since its last sync
        - name: Content-Encoding
          in: header
          required: false
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Merged; body is the backup the client must apply
          headers:
            X-Sync-Cursor:
              schema:
                type: integer
                format: int64
              description: Cursor to send on the next request
            X-Sync-Changed:
              schema:
                type: boolean
              description: false when the body carries nothing the client does not already have
            X-Sync-Full-Requested:
              schema:
                type: boolean
              description: Present when the server wants a full library on the next request
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing device id, invalid cursor or category list, or body is not a backup
        '401':
          description: Unauthorized
        '413':
          description: Body larger than the configured limit
        '500':
          description: Internal server error
  /sync/v2/snapshot:
    get:
      tags:
        - Sync v2
      summary: Download the whole merged library
      operationId: syncV2Snapshot
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Sync-Cursor
          in: header
          required: false
          schema:
            type: integer
            format: int64
          description: When equal to the server cursor the answer is 304
      responses:
        '200':
          description: Full library
          headers:
            X-Sync-Cursor:
              schema:
                type: integer
                format: int64
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Nothing changed since the cursor
        '401':
          description: Unauthorized
        '404':
          description: Nothing stored for this API key yet
  /sync/admin/{apikey}/status:
    get:
      tags:
        - Sync Admin
      summary: Sync status of an API key
      operationId: getSyncStatus
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '401':
          description: Unauthorized
        '404':
          description: Nothing known about this API key yet
        '500':
          description: Internal server error
  /sync/admin/{apikey}/devices:
    get:
      tags:
        - Sync Admin
      summary: Devices that synced with an API key
      operationId: listSyncDevices
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncDevice'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /sync/admin/{apikey}/history:
    get:
      tags:
        - Sync Admin
      summary: Previous sync payloads kept for an API key
      description: Newest first. The number of entries kept is `syncHistoryLimit`.
      operationId: listSyncHistory
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncHistoryEntry'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /sync/admin/{apikey}/history/{id}/restore:
    post:
      tags:
        - Sync Admin
      summary: Roll back to a previous sync payload
      description: |
        Makes the history entry the current payload under a new ETag. Devices holding the
        old ETag get `412` on their next `If-Match` upload and re-sync.
      operationId: restoreSyncHistory
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyPath'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  etag:
                    type: string
        '400':
          description: Invalid id
        '401':
          description: Unauthorized
        '404':
          description: Unknown history entry
        '500':
          description: Internal server error
  /updates/latest:
    get:
      summary: Get the latest release information
      description: Get the latest release information
      operationId: getLatestRelease
      tags:
        - Updates
      responses:
        '200':
          description: Latest release information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '204':
          description: No latest release information available
  /updates/check:
    get:
      summary: Check for updates
      description: Check for updates
      operationId: checkUpdates
      tags:
        - Updates
      responses:
        '204':
          description: Check for updates request was successful
tags:
  - name: Authentication
    description: Authentication endpoints
  - name: API Keys
    description: API Key endpoints
  - name: Health Check
    description: Health check endpoints
  - name: Configuration
    description: Configuration endpoints
  - name: Logs
    description: Log endpoints
  - name: Notifications
    description: Notification endpoints
  - name: Updates
    description: Update endpoints
  - name: Sync
    description: Protocol v1 sync endpoints (deprecated, still supported)
  - name: Sync v2
    description: Protocol v2 sync endpoints (server-side merge, delta sync)
  - name: Sync Admin
    description: Sync inspection endpoints used by the web UI (session)

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Token
    CookieAuth:
      type: apiKey
      in: cookie
      name: user_session
  parameters:
    ApiKeyPath:
      name: apikey
      in: path
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag from a previous response
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag the client last saw
    DeviceId:
      name: X-Device-ID
      in: header
      required: false
      schema:
        type: string
      description: Stable identifier of the client device (optional, used for the device list)
    DeviceName:
      name: X-Device-Name
      in: header
      required: false
      schema:
        type: string
      description: Human readable device name (optional)
  schemas:
    APIKey:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
        - name
        - key
        - scopes
        - created_at
    User:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    ConfigJson:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        log_level:
          type: string
        log_path:
          type: string
        log_max_size:
          type: integer
        log_max_backups:
          type: integer
        base_url:
          type: string
        check_for_updates:
          type: boolean
        version:
          type: string
        commit:
          type: string
        date:
          type: string
    ConfigUpdate:
      type: object
      properties:
        check_for_updates:
          type: boolean
        log_level:
          type: string
        log_path:
          type: string
    LogfilesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/LogFile'
        count:
          type: integer
    LogFile:
      type: object
      properties:
        filename:
          type: string
        size_bytes:
          type: integer
        size:
          type: string
        updated_at:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
            - DISCORD
            - NOTIFIARR
            - IFTTT
            - JOIN
            - MATTERMOST
            - MATRIX
            - PUSH_BULLET
            - PUSHOVER
            - ROCKETCHAT
            - SLACK
            - TELEGRAM
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
            enum:
              - SERVER_UPDATE_AVAILABLE
              - SYNC_STARTED
              - SYNC_SUCCESS
              - SYNC_FAILED
              - SYNC_ERROR
              - SYNC_CANCELLED
              - TEST
        token:
          type: string
        apiKey:
          type: string
        webhook:
          type: string
        title:
          type: string
        icon:
          type: string
        username:
          type: string
        host:
          type: string
        password:
          type: string
        channel:
          type: string
        rooms:
          type: string
        targets:
          type: string
        devices:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Release:
      type: object
      properties:
        tag_name:
          type: string
          description: The tag name of the release
        name:
          type: string
          description: The name of the release
        body:
          type: string
          description: The description of the release
        published_at:
          type: string
          format: date-time
          description: The publication date and time of the release
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
    Asset:
      type: object
      properties:
        name:
          type: string
          description: The name of the asset
        size:
          type: integer
          format: int64
          description: The size of the asset in bytes
        browser_download_url:
          type: string
          description: The download URL for the asset
    SyncStatus:
      type: object
      properties:
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful upload
        last_event_at:
          type: string
          format: date-time
          nullable: true
        last_event:
          type: string
        last_status:
          type: string
          enum: ['', running, success, error, cancelled]
        last_device:
          type: string
        last_message:
          type: string
        data_size:
          type: integer
          format: int64
          description: Size of the stored payload in bytes
        data_updated_at:
          type: string
          format: date-time
          nullable: true
    SyncDevice:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        last_seen:
          type: string
          format: date-time
        last_event:
          type: string
        last_status:
          type: string
        last_message:
          type: string
        created_at:
          type: string
          format: date-time
    SyncHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        etag:
          type: string
        size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    SyncEventRequest:
      type: object
      description: Body for reporting a device sync event (POST /sync/event)
      required:
        - event
      properties:
        event:
          type: string
          enum:
            - SYNC_STARTED
            - SYNC_SUCCESS
            - SYNC_FAILED
            - SYNC_ERROR
            - SYNC_CANCELLED
          description: The sync event type reported by the device
        device_id:
          type: string
          description: Optional stable identifier of the device (the `X-Device-ID` header takes precedence)
        device_name:
          type: string
          description: Optional name of the device that triggered the sync
        message:
          type: string
          description: Optional detail (e.g. error message for SYNC_FAILED, reason for SYNC_CANCELLED)
