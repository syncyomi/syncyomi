name: e2e

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      tachiyomi_ref:
        description: "TachiyomiSY ref to build (blank = repo variable)"
      suwayomi_ref:
        description: "Suwayomi-Server ref to build (blank = repo variable)"
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      sync: ${{ steps.filter.outputs.sync || 'true' }}
      shards: ${{ steps.shards.outputs.shards }}
      tachiyomi_sha: ${{ steps.refs.outputs.tachiyomi_sha }}
      suwayomi_sha: ${{ steps.refs.outputs.suwayomi_sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            sync:
              - "internal/**"
              - "proto/**"
              - "e2e/**"
              - "main.go"
              - "go.mod"
              - ".github/workflows/e2e.yml"

      - id: shards
        run: echo "shards=$(e2e/scripts/shards.sh)" >> "$GITHUB_OUTPUT"

      - id: refs
        run: |
          resolve() { git ls-remote "https://github.com/$1.git" "refs/heads/$2" "refs/tags/$2" | head -1 | cut -f1; }
          sha=$(resolve "$TACHIYOMI_REPO" "$TACHIYOMI_REF")
          echo "tachiyomi_sha=${sha:-$TACHIYOMI_REF}" >> "$GITHUB_OUTPUT"
          sha=$(resolve "$SUWAYOMI_REPO" "$SUWAYOMI_REF")
          echo "suwayomi_sha=${sha:-$SUWAYOMI_REF}" >> "$GITHUB_OUTPUT"
        env:
          TACHIYOMI_REPO: ${{ vars.E2E_TACHIYOMI_REPO || 'syncyomi/TachiyomiSY' }}
          TACHIYOMI_REF: ${{ inputs.tachiyomi_ref || vars.E2E_TACHIYOMI_REF || 'feat/syncyomi-v2' }}
          SUWAYOMI_REPO: ${{ vars.E2E_SUWAYOMI_REPO || 'syncyomi/Suwayomi-Server' }}
          SUWAYOMI_REF: ${{ inputs.suwayomi_ref || vars.E2E_SUWAYOMI_REF || 'feat/syncyomi-v2' }}

  build-apk:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v6
        id: apk
        with:
          path: /tmp/e2e-build/app-x86_64-debug.apk
          key: tachiyomi-apk-${{ needs.changes.outputs.tachiyomi_sha }}

      - uses: actions/checkout@v7
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          repository: ${{ vars.E2E_TACHIYOMI_REPO || 'syncyomi/TachiyomiSY' }}
          ref: ${{ needs.changes.outputs.tachiyomi_sha }}

      - uses: actions/checkout@v7
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          path: .syncyomi
          sparse-checkout: e2e/gradle

      - uses: actions/setup-java@v6
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          cache-read-only: false

      - name: Build debug APK
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          gradle_retry() {
            ./gradlew "$@" && return
            for delay in 60 120; do
              echo "::warning::gradle failed, retrying in ${delay}s"; sleep "$delay"
              ./gradlew "$@" --refresh-dependencies && return
            done
            return 1
          }
          gradle_retry --init-script .syncyomi/e2e/gradle/fallback-repo.init.gradle.kts :app:assembleDebug
          mkdir -p /tmp/e2e-build
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk /tmp/e2e-build/
        env:
          SYNCYOMI_M2_FALLBACK: ${{ github.workspace }}/.syncyomi/e2e/gradle/m2

      - uses: actions/cache/save@v6
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          path: /tmp/e2e-build/app-x86_64-debug.apk
          key: tachiyomi-apk-${{ needs.changes.outputs.tachiyomi_sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: tachiyomi-apk
          path: /tmp/e2e-build/app-x86_64-debug.apk
          retention-days: 3

  build-suwayomi:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v6
        id: jar
        with:
          path: /tmp/e2e-build/suwayomi
          key: suwayomi-jar-${{ needs.changes.outputs.suwayomi_sha }}

      - uses: actions/checkout@v7
        if: steps.jar.outputs.cache-hit != 'true'
        with:
          repository: ${{ vars.E2E_SUWAYOMI_REPO || 'syncyomi/Suwayomi-Server' }}
          ref: ${{ needs.changes.outputs.suwayomi_sha }}

      - uses: actions/setup-java@v6
        if: steps.jar.outputs.cache-hit != 'true'
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        if: steps.jar.outputs.cache-hit != 'true'
        with:
          cache-read-only: false

      - name: Configure build memory
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          echo "org.gradle.jvmargs=-Xmx2g" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m" >> gradle.properties

      - name: Build shadowJar
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          gradle_retry() {
            ./gradlew "$@" && return
            for delay in 60 120; do
              echo "::warning::gradle failed, retrying in ${delay}s"; sleep "$delay"
              ./gradlew "$@" --refresh-dependencies && return
            done
            return 1
          }
          gradle_retry :server:shadowJar
          mkdir -p /tmp/e2e-build/suwayomi
          cp server/build/Suwayomi-Server-*.jar /tmp/e2e-build/suwayomi/

      - uses: actions/cache/save@v6
        if: steps.jar.outputs.cache-hit != 'true'
        with:
          path: /tmp/e2e-build/suwayomi
          key: suwayomi-jar-${{ needs.changes.outputs.suwayomi_sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: suwayomi-jar
          path: /tmp/e2e-build/suwayomi/Suwayomi-Server-*.jar
          retention-days: 3

  e2e-shard:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [changes, build-apk, build-suwayomi]
    if: needs.changes.outputs.sync == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Set up corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web/dist
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          CI= pnpm run build

      - name: Point ANDROID_SDK_ROOT at the preinstalled SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Cache emulator, system image and Maestro
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-35
            e2e/.tools
          key: e2e-android-${{ runner.os }}-${{ hashFiles('e2e/scripts/setup-env.sh') }}

      - name: Set up E2E environment
        run: |
          e2e/scripts/setup-env.sh
          e2e/scripts/doctor.sh || true

      - uses: actions/download-artifact@v8
        with:
          name: tachiyomi-apk
          path: /tmp/e2e-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: suwayomi-jar
          path: /tmp/e2e-artifacts

      - name: Run E2E shard
        env:
          E2E_TACHIYOMI_APK: /tmp/e2e-artifacts/app-x86_64-debug.apk
        run: |
          adb kill-server || true
          ADB_TRACE=adb,transport adb start-server
          export E2E_SUWAYOMI_JAR="$(ls /tmp/e2e-artifacts/Suwayomi-Server-*.jar | head -1)"
          e2e/scripts/run-e2e.sh -run '${{ matrix.run }}'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts-${{ matrix.name }}
          path: |
            e2e/artifacts/
            !e2e/artifacts/**/suwayomi-data/bin/**
            !e2e/artifacts/**/suwayomi-data/webUI/**
            !e2e/artifacts/**/syncyomi-e2e
          retention-days: 7
          include-hidden-files: true

  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "$CHANGES/$SYNC/$SHARDS" in
            success/false/skipped | success/true/success) exit 0 ;;
            *) echo "changes=$CHANGES sync=$SYNC shards=$SHARDS"; exit 1 ;;
          esac
        env:
          CHANGES: ${{ needs.changes.result }}
          SYNC: ${{ needs.changes.outputs.sync }}
          SHARDS: ${{ needs.e2e-shard.result }}
