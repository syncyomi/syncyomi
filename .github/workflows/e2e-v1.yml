name: e2e-v1

# The v1 protocol suite is server-only (no emulators, APKs or Suwayomi) and runs in
# minutes; it stays deliberately separate from the full e2e workflow.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: e2e-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      sync: ${{ steps.filter.outputs.sync || 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            sync:
              - "internal/**"
              - "proto/**"
              - "e2e/**"
              - "main.go"
              - "go.mod"
              - ".github/workflows/e2e-v1.yml"

  e2e-v1:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web/dist
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          CI= pnpm run build

      - name: Run v1 E2E suite
        run: e2e/scripts/run-e2e-v1.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-v1-failure-artifacts
          path: e2e/artifacts/
          retention-days: 7

  # Go test matrix for the database package: SQLite (default) and Postgres.
  # Neither step needs web/dist; only the server packages are built.
  go-test-postgres:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.1-alpine
        env:
          POSTGRES_USER: SyncYomi
          POSTGRES_PASSWORD: SyncYomi
          POSTGRES_DB: syncyomi
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U SyncYomi -d syncyomi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run database tests (SQLite, default)
        run: go test ./internal/database/... -count=1

      - name: Run database tests (Postgres)
        env:
          SYNCYOMI_TEST_POSTGRES_DSN: "postgres://SyncYomi:SyncYomi@127.0.0.1:5434/syncyomi?sslmode=disable"
        run: go test ./internal/database/... -count=1 -v
